<!DOCTYPE html>
<html>
<body>

<script>

let a = Number(prompt("Enter first number"));
let b = Number(prompt("Enter second number"));

if(a>b){
    document.write("Largest = " + a);
    document.write("<br>");
    document.write("Smallest = " + b);
}
else{
    document.write("Largest = " + b);
    document.write("<br>");
    document.write("Smallest = " + a);
}

</script>

</body>
</html>
